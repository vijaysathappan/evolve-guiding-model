[project]
name = "evolve-gm-backend"
version = "0.1.0"
description = "EvolveGM Cognitive Learning AI Platform Backend"
authors = [
    { name = "EvolveGM Engineering", email = "engineering@evolvegm.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "factory-boy>=3.3.0",
    "ruff>=0.3.4",
    "black>=24.3.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
