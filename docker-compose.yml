version: '3.8'

services:
  # 1. Vite Frontend (Development)
  frontend:
    build: .
    target: builder
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_LLM_API_URL=http://localhost:8000
    command: npm run dev

  # 2. Node.js Backend (Auth & History)
  backend-node:
    build: .
    target: backend-node
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - PYTHON_LLM_URL=http://llm-service:8000
    depends_on:
      - llm-service

  # 3. Python LLM Service
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: llm-service
    ports:
      - "8000:8000"
    env_file: .env
